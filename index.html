<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karamazov Sinov Markazi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 450px;
            width: 90%;
            z-index: 10;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            color: #e94560;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .answers-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .btn {
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 100%;
        }

        .btn-safe {
            background-color: #0f3460;
            color: white;
            border: 2px solid #e94560;
        }

        .btn-safe:hover {
            background-color: #e94560;
            transform: scale(1.03);
        }

        /* Qochuvchi tugmalar uchun alohida dizayn */
        .btn-danger {
            background-color: #e94560;
            color: white;
            position: relative;
            transition: transform 0.1s ease-out;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Natija ekkoni */
        .result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        .result-screen h2 {
            font-size: 26px;
            color: #4ecca3;
            margin-bottom: 15px;
            text-align: center;
        }

        .result-screen p {
            font-size: 20px;
            color: #ffd369;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container" id="quizContainer">
        <h1>Karamazov buyukmi?</h1>
        <div class="answers-grid" id="answersGrid">
            <button class="btn btn-safe" onclick="handleWin()">1. Ha buyuk</button>
            <button class="btn btn-danger" id="btn2" onmousemove="dodge(event, this)" ontouchmove="dodgeTouch(event, this)" onclick="blockClick(event)">2. Yo'q buyuk emas</button>
            <button class="btn btn-danger" id="btn3" onmousemove="dodge(event, this)" ontouchmove="dodgeTouch(event, this)" onclick="blockClick(event)">3. Tan olmiman</button>
            <button class="btn btn-safe" id="btn4" onclick="handleWin()">4. 1 javob to'g'ri</button>
        </div>
    </div>

    <div class="container result-screen" id="resultContainer">
        <h2 id="msg1"></h2>
        <p id="msg2"></p>
    </div>

    <script>
        // Har bir qochuvchi tugma uchun siljish koordinatalarini saqlab turamiz
        const positions = {
            btn2: { x: 0, y: 0 },
            btn3: { x: 0, y: 0 }
        };

        function calculateNewPos(btn, clientX, clientY) {
            const rect = btn.getBoundingClientRect();
            // Tugmaning markazi
            const btnCenterX = rect.left + rect.width / 2;
            const btnCenterY = rect.top + rect.height / 2;

            // Mishka yoki barmoqdan qaysi tomonga qochish kerakligini hisoblaymiz (aks yo'nalishda)
            let dx = btnCenterX - clientX;
            let dy = btnCenterY - clientY;

            // Masofani normallashtiramiz
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            // Agar juda yaqin kelgan bo'lsa (masalan 90 piksel)
            if (dist < 90) {
                // Agar kordinatalar 0 ga yaqin bo'lsa, tasodifiy surilish beramiz
                if (dx === 0 && dy === 0) {
                    dx = (Math.random() - 0.5) * 50;
                    dy = (Math.random() - 0.5) * 50;
                }

                const id = btn.id;
                // Qochish tezligi va yo'nalishi (parallel va kulguli qochish)
                positions[id].x += (dx / dist) * 25;
                positions[id].y += (dy / dist) * 25;

                // Ekrandan chiqib ketib yo'qolib qolmasligi uchun chegaralovchi limitlar (-120 dan +120 gacha)
                const limit = 110;
                positions[id].x = Math.max(-limit, Math.min(limit, positions[id].x));
                positions[id].y = Math.max(-limit, Math.min(limit, positions[id].y));

                // Tugmani suramiz va biroz qimirlatib (aylantirib) qo'yamiz
                const rotateDeg = positions[id].x * 0.2;
                btn.style.transform = `translate(${positions[id].x}px, ${positions[id].y}px) rotate(${rotateDeg}deg)`;
            }
        }

        function dodge(e, btn) {
            calculateNewPos(btn, e.clientX, e.clientY);
        }

        function dodgeTouch(e, btn) {
            if (e.touches && e.touches.length > 0) {
                const touch = e.touches[0];
                calculateNewPos(btn, touch.clientX, touch.clientY);
            }
        }

        function blockClick(event) {
            event.preventDefault();
            event.stopPropagation();
        }

        function handleWin() {
            const quizContainer = document.getElementById('quizContainer');
            const resultContainer = document.getElementById('resultContainer');
            
            quizContainer.style.display = 'none';
            resultContainer.style.display = 'flex';

            const msg1 = document.getElementById('msg1');
            const msg2 = document.getElementById('msg2');

            msg1.textContent = "To'g'ri topdingiz bo'tam";

            setTimeout(() => {
                msg2.textContent = "Bo'ldi chiqib ketaver harp";
            }, 1500);
        }
    </script>
</body>
</html>
